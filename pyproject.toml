[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-stage-classification"
version = "0.1.0"
description = "Temporally-aware, explainable multimodal sleep stage classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
full = [
  "mne>=1.6",
  "PyWavelets>=1.5",
  "lightgbm>=4.0",
  "imbalanced-learn>=0.11",
  "hmmlearn>=0.3",
  "shap>=0.44",
  "google-genai>=1.0",
  "bert-score>=0.3",
]
dev = [
  "pytest>=7.4",
]

[project.scripts]
sleep-stage = "sleep_stage_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
